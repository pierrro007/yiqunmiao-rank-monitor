name: 每日排行榜监控

on:
  schedule:
    # UTC 02:00/04:00/07:00/13:00 = 北京时间 10:00/12:00/15:00/21:00（每天查 4 次，捕捉日内波动）
    - cron: '0 2,4,7,13 * * *'
  # 允许在 Actions 页面手动点一下立即跑（用于测试）
  workflow_dispatch:

# 允许 workflow 把更新后的 rank-history.json 提交回仓库
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行监控（仅京东：美国服务器可正常抓取京东；当当子分类页需中国境内环境抓取）
        env:
          FETCH_MODE: jd
        run: python3 monitor_run.py | tee result.json

      - name: 提交并推送变化
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rank-history.json
          # product-map.json：商品ID→书名映射（书改名也认得出），需一并持久化
          [ -f product-map.json ] && git add product-map.json
          if git diff --cached --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore: 每日排行榜更新 $(TZ=Asia/Shanghai date +%F)"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi

      - name: 推送飞书（有变化时）
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python3 feishu_push.py

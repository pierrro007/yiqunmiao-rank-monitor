name: 每日排行榜监控

on:
  schedule:
    # UTC 03:00 = 北京时间 11:00
    - cron: '0 3 * * *'
  # 允许在 Actions 页面手动点一下立即跑（用于测试）
  workflow_dispatch:

# 允许 workflow 把更新后的 rank-history.json 提交回仓库
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行监控（抓取四主榜 + 京东13子榜 → 变化判定 → 落库）
        run: python3 monitor_run.py

      - name: 提交并推送变化
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rank-history.json
          if git diff --cached --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore: 每日排行榜更新 $(TZ=Asia/Shanghai date +%F)"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi
